name: Build Windows app
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt pyinstaller
      - name: Build
        run: >
          pyinstaller --onefile --noconsole --name AirPad --icon assets/AirPad.ico
          --add-data "index.html;." --add-data "icon-192.png;." --add-data "icon-512.png;." --add-data "apple-touch-icon.png;."
          --hidden-import pynput.keyboard._win32 --hidden-import pynput.mouse._win32 --hidden-import pystray._win32
          server.py
      - uses: actions/upload-artifact@v4
        with:
          name: AirPad-windows
          path: dist/AirPad.exe
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/AirPad.exe
          body_path: RELEASE_NOTES.md
